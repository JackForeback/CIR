# configs/base.yaml
experiment: linear
input_dim: 2
num_classes: 3
loss_type: mse
lr: 0.001
num_training_steps: 50
num_seeds: 100
samples_per_class: 10000
train_ratio: .7
radius: 10
scalars: [1,1,1]
rotations: [0,0,0]

save_dir: runs/vae_test

# Fairness methods
flags:
  per_class_gap: False
  soft_accuracy_gap: False
  use_fairness_loss: False
  evo_weights: False
  
# Projections flags
apply_projection: False
target: max             # target (str): 'mean', 'median', or 'max'
projection_mode: shift  # mode (str): 'shift' or 'scale'

# paths
log_dir: /mnt/home/forebacj/CIR/logs/vae_experiment
